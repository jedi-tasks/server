name: lint

on:
  pull_request:
#  push:

permissions:
  contents: read

env:
  DIRECTORY: server

jobs:

  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

        # Настраиваем Go
      - uses: actions/setup-go@v4
        with:
          go-version: '1.25'

        # Проверяем код линтером
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          working-directory: ${{ env.DIRECTORY }}
          version: latest
          # Тесты тянут testcontainers с зависимостями Docker — анализ дольше минуты по умолчанию
          args: --timeout=5m
