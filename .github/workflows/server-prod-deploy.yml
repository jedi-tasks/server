name: prod deploy

on:
  push:
    tags:
      - v*

# id-token — вход в Vault по GitHub OIDC в reusable-deploy
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  general-deploy-pipeline:
    uses: finfix/devops/.github/workflows/reusable-deploy.yml@main
    with:
      image_name: ${{ github.repository }}
      make_command: deploy-tasks-server
      devops_repository: finfix/devops
      # Сервер живёт в кластере coin и берёт секреты проекта coin (vault/terraform в finfix/devops)
      vault_role: gh-jedi-tasks-server-deploy-prod
      vault_project: coin
      vault_kubeconfig: coin-server-prod
    secrets: inherit
