name: dev deploy

on:
  # Ручной перезапуск деплоя без нового коммита
  workflow_dispatch:
  push:
    branches:
      - release/*
      - hotfix/*

# id-token — вход в Vault по GitHub OIDC в reusable-deploy
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  general-deploy-pipeline:
    uses: bonavi/devops_common/.github/workflows/reusable-deploy.yml@main
    with:
      image_name: ${{ github.repository }}-dev
      make_command: deploy-tasks-server-dev
      devops_repository: finfix/devops
      vault_role: gh-jedi-tasks-server-deploy-dev
      vault_pat_secret: jedi-tasks/ci/github-pat
      vault_kubeconfig_secret: jedi-tasks/ci/tasks-server-dev-kubeconfig
      # Сервер живёт в кластере coin: уведомления — общая инфраструктура кластера (infra)
      vault_notify_secret: infra/ci/deploy-notify
      # kube-apiserver coin-1 доступен только через WireGuard
      vault_wireguard_secret: infra/ci/wireguard
    secrets: inherit
