name: dev deploy

on:
  push:
    branches:
      - release/*
      - hotfix/*

# id-token — вход в Vault по GitHub OIDC в reusable-deploy
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  general-deploy-pipeline:
    uses: finfix/devops/.github/workflows/reusable-deploy.yml@main
    with:
      image_name: ${{ github.repository }}-dev
      make_command: deploy-tasks-server-dev
      devops_repository: finfix/devops
      vault_role: gh-jedi-tasks-server-deploy-dev
      vault_pat_secret: ci/jedi-tasks/github-pat
      vault_kubeconfig_secret: ci/jedi-tasks/tasks-server-dev-kubeconfig
      # Сервер живёт в кластере coin: SOPS-ключ и уведомления — общие секреты coin
      vault_sops_secret: ci/coin/helmfile-sops
      vault_notify_secret: ci/coin/deploy-notify
    secrets: inherit
